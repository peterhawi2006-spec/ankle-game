  --yel: #ffd23f; --cyan: #6edeee; --coral: #ff6b6b; --green: #6ee787; --purple: #b094ff;
  --display: "Jersey 10", "VT323", ui-monospace, monospace;
  --body: "VT323", ui-monospace, "Courier New", monospace;
  --label: "Press Start 2P", "VT323", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); overflow: hidden; }
body { color: var(--ink); font-family: var(--body); }
#fit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
#screen { position: absolute; left: var(--mx, 0px); top: var(--my, 0px); width: 1280px; height: 720px; }
#stage { width: 1280px; height: 720px; flex: none; position: relative; overflow: hidden; background: var(--bg);
  background-image: linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px);
  background-size: 40px 40px; background-position: center top; transform-origin: center center; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; position: absolute; left: 0; top: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

/* ---------- shared chrome */
.top { position: absolute; left: calc(var(--mx, 0px) * -1); right: calc(var(--mx, 0px) * -1); top: calc(var(--my, 0px) * -1); height: 68px; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: #07060c; border-bottom: 2px solid var(--line); }
.chip { font-family: var(--label); font-size: 16px; padding: 8px 10px 6px; background: var(--yel); color: #07060c; white-space: nowrap; }
.chip.ghost { background: none; color: var(--cyan); border: 2px solid var(--cyan); padding: 6px 8px 4px; }
.top h1 { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1; letter-spacing: 1px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bottom { position: absolute; left: calc(var(--mx, 0px) * -1); right: calc(var(--mx, 0px) * -1); bottom: calc(var(--my, 0px) * -1); height: 56px; display: flex; align-items: center; gap: 20px; padding: 0 24px; background: #07060c; border-top: 2px solid var(--line); }
.src { font-size: 20px; line-height: 22px; max-height: 44px; color: var(--dim); flex: 1; overflow: hidden; }
.pips { display: flex; gap: 8px; }
.pips i { width: 14px; height: 14px; background: var(--line); }
.pips i.on { background: var(--yel); }
.hint { font-family: var(--label); font-size: 10px; color: var(--dim); white-space: nowrap; }
.hint b { color: var(--ink); font-weight: 400; }
.nav { display: flex; gap: 8px; }
.nav button { font-family: var(--label); font-size: 16px; width: 56px; height: 36px; border: 2px solid var(--line); color: var(--ink); }
.nav button:hover { border-color: var(--yel); color: var(--yel); }

/* ---------- lesson */
.art { position: absolute; left: 24px; top: 88px; width: 664px; height: 560px; background: #131222; border: 2px solid var(--line); overflow: hidden; }
.art .wrap { position: absolute; }
.art img.ov { visibility: hidden; }
.art img.ov.show { visibility: visible; }
.art img.ov.blink { animation: blink .5s steps(2, jump-none) 4; }
.art .wrap.shake { animation: shake .4s steps(8) 1; }
.viewtag { display: none !important; position: absolute; left: 0; bottom: 0; font-family: var(--label); font-size: 10px; line-height: 1; color: var(--dim); background: #07060c; padding: 7px 8px 5px; }
.viewtag:empty { display: none; }
.card { position: absolute; left: 712px; top: 88px; width: 544px; height: 560px; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { font-family: var(--label); font-size: 10px; padding: 8px 8px 6px; border: 2px solid var(--line); color: var(--dim); }
.tabs button.cur { border-color: var(--c); color: #07060c; background: var(--c); }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 50px; line-height: .95; letter-spacing: 1px; color: var(--c); text-wrap: balance; }
.card .sub { font-size: 32px; line-height: 1; color: var(--dim); margin-top: -6px; }
.stat { display: flex; align-items: flex-end; gap: 16px; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 120px; line-height: .8; color: var(--c); white-space: nowrap; flex: none; }
.stat span { font-size: 32px; line-height: 1; padding-bottom: 4px; }
.bul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
.bul li { font-size: 32px; line-height: 34px; padding-left: 30px; position: relative; }
.bul li::before { content: ""; position: absolute; left: 2px; top: 10px; width: 14px; height: 14px; background: var(--k, var(--c)); }
.bul li .hid { visibility: hidden; }
.bul li b { font-weight: 400; color: var(--k, var(--c)); }
.action { font-size: 32px; line-height: 34px; border-top: 2px solid var(--line); padding-top: 12px; }
.action b { font-weight: 400; color: var(--c); }

/* ---------- title */
.title-l { position: absolute; left: 64px; top: 96px; width: 530px; }
.t1 { font-family: var(--label); font-size: 72px; line-height: 1; color: var(--yel); }
.t2 { font-family: var(--label); font-size: 64px; line-height: 1; margin-top: 18px; }
.t3 { font-family: var(--label); font-size: 32px; line-height: 1; margin-top: 22px; color: var(--cyan); }
.tsub { font-size: 32px; line-height: 34px; margin-top: 30px; max-width: 500px; }
.press { font-family: var(--label); font-size: 32px; color: var(--yel); margin-top: 36px; display: inline-block; animation: blink 1s steps(2, jump-none) infinite; }
.players { position: absolute; left: 64px; bottom: 48px; font-size: 32px; line-height: 34px; }
.players small { display: block; font-family: var(--label); font-size: 16px; color: var(--cyan); margin-bottom: 12px; }
.hero { position: absolute; right: 48px; top: 84px; width: 664px; height: 560px; }

/* ---------- map */
.rows { position: absolute; left: 64px; top: 96px; width: 1152px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 20px; height: 74px; padding: 0 20px 0 0; border: 2px solid var(--line); background: var(--panel); text-align: left; width: 100%; }
.row .n { font-family: var(--label); font-size: 24px; width: 84px; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--line); color: var(--ink); }
.row .t { font-family: var(--display); font-size: 40px; line-height: 1; flex: none; width: 500px; }
.row .d { font-size: 32px; line-height: 1; color: var(--dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .p { font-family: var(--label); font-size: 16px; color: var(--cyan); flex: none; width: 140px; text-align: right; }
.row.sel { border-color: var(--yel); }
.row.sel .n { background: var(--yel); color: #07060c; }
.row.lock { opacity: .45; cursor: default; }
.row.lock .p { color: var(--dim); }

/* ---------- level intro / end */
.lv-l { position: absolute; left: 64px; top: 68px; bottom: 56px; width: 500px; display: flex; flex-direction: column; justify-content: center; }
.lv-k { font-family: var(--label); font-size: 32px; color: var(--dim); }
.lv-n { font-family: var(--label); font-size: 96px; line-height: 1; color: var(--yel); margin-top: 14px; }
.lv-t { font-family: var(--display); font-size: 60px; line-height: .9; margin-top: 28px; text-wrap: balance; }
.lv-s { font-size: 32px; line-height: 34px; margin-top: 18px; }
.lv-p { margin-top: 26px; display: flex; gap: 18px; align-items: center; }
.ready { font-family: var(--label); font-size: 16px; color: var(--green); animation: blink 1s steps(2, jump-none) infinite; }
.center .lv-t { margin-top: 0; font-size: 100px; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; }

.note { font-size: 32px; line-height: 34px; border-top: 2px solid var(--line); padding-top: 12px; }
.note b { font-weight: 400; color: var(--n); }
.board { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 24px 28px; }
.brow { display: flex; align-items: center; gap: 18px; min-height: 70px; padding: 8px 14px; border: 2px solid transparent; color: var(--dim); }
.brow .bn { font-family: var(--label); font-size: 16px; width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--line); color: var(--ink); }
.brow .bt { font-family: var(--display); font-size: 50px; line-height: .9; letter-spacing: 1px; }
.brow.on { border-color: var(--c); color: var(--c); background: #1b1a30; }
.brow.on .bn { background: var(--c); color: #07060c; }
.brow.all { color: var(--ink); }
.refs { position: absolute; left: 40px; right: 40px; top: 88px; bottom: 68px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
.refs p { font-size: 24px; line-height: 25px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.refs p b { font-weight: 400; color: var(--yel); }
.sndb { font-family: var(--label); font-size: 10px; height: 36px; padding: 0 10px; border: 2px solid var(--line); color: var(--dim); white-space: nowrap; }
.sndb.on { color: var(--green); border-color: var(--green); }
.sndb.warn { color: var(--yel); border-color: var(--yel); }
#vox { margin-left: 8px; }
/* phones: bigger touch targets, no keyboard hints */
.phone .bottom { height: 68px; }
.phone .sndb { height: 52px; font-size: 13px; padding: 0 14px; }
.phone .nav button { width: 84px; height: 52px; font-size: 20px; }
.mapb { display: none; }
.phone .mapb { display: inline-block; color: var(--yel); border-color: var(--yel); }
.phone .hint { display: none; }
.phone .hint.heard { display: block; font-size: 13px; }
#flash { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .28s steps(4) 1; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-9px, 3px); } 50% { transform: translate(9px, -3px); } 75% { transform: translate(-6px, 0); } }
@media (prefers-reduced-motion: reduce) { .press, .ready, .art img.ov.blink, .art .wrap.shake, #flash.go { animation: none; } }
</style>
</head>

    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
    while ((n = w.nextNode())) if (n.nodeValue.trim()) nodes.push(n);
  });
  const parts = nodes.map(n => { const full = n.nodeValue, vis = document.createTextNode(""), hid = document.createElement("span");
    hid.className = "hid"; hid.textContent = full; n.parentNode.insertBefore(vis, n); n.parentNode.insertBefore(hid, n); n.remove(); return { full, vis, hid, k: 0 }; });
  let i = 0, fr = 0;
  typing = { parts, t: setInterval(() => {
    let budget = 6; if (fr++ % 3 === 0) sfx("tick");
    while (budget > 0 && i < parts.length) { const p = parts[i]; const take = Math.min(budget, p.full.length - p.k); p.k += take; budget -= take;
      p.vis.nodeValue = p.full.slice(0, p.k); p.hid.textContent = p.full.slice(p.k); if (p.k >= p.full.length) i++; }
    if (i >= parts.length) stopTyping(false);
  }, 16) };
}
function stopTyping(finish) {
  if (!typing) return false;
  clearInterval(typing.t);
  typing.parts.forEach(p => { p.vis.nodeValue = p.full; p.hid.textContent = ""; });
  typing = null; return true;
}

/* ---------- voice control (optional, off until V is pressed)
   Published page: Claude's dictation capability. Offline file: the browser's own speech recognition (Chrome / Edge).
   A command fires only when the spoken phrase ENDS with it and about half a second of silence follows. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const PHONE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.platform || ""));
if (PHONE) document.documentElement.classList.add("phone");
const VDBG = location.hash === "#voicetest", VD = { engine: "?", starts: 0, error: "-", heard: "-", kind: "-", command: "-", events: 0 };
function vlog(o) {
  if (!VDBG) return; Object.assign(VD, o);
  let p = document.getElementById("vdbg");
  if (!p) { p = document.createElement("div"); p.id = "vdbg"; p.style.cssText = "position:fixed;left:0;top:0;z-index:99;max-width:100%;padding:6px 8px;font:12px/1.35 monospace;background:rgba(0,0,0,.85);color:#6ee787;white-space:pre-wrap;pointer-events:none"; document.body.appendChild(p); }
  p.textContent = "VOICE TEST  engine: " + VD.engine + "  phone mode: " + (PHONE ? "yes" : "no") + "  state: " + voice + "  starts: " + VD.starts + "  events: " + VD.events +
    "\nlast error: " + VD.error + "\nheard (" + VD.kind + "): " + VD.heard + "\nlast command: " + VD.command;
}
let dict = null, dictLang = true, voice = "off", rec = null, vFails = 0, vBuf = "", vPart = "", vWait = 0, vMute = 0, vDone = "", vCmd = "", vFiredAt = 0, vHint = 0;
const V_CMD = [["next", /\b(next|necks|nex) slides?$/], ["back", /\b(go back|previous slide)$/]];
const V_LABEL = { off: "VOICE OFF", on: "VOICE ON", wait: "VOICE ...", paused: "VOICE PAUSED", blocked: "MIC BLOCKED", none: "NO VOICE", net: "NO INTERNET", error: "VOICE ERROR" };
const vNorm = t => t.toLowerCase().replace(/[^a-z ]+/g, " ").replace(/\s+/g, " ").trim();
function voiceMatch(t) { for (const [c, re] of V_CMD) if (re.test(t)) return c; return null; }
function voxHTML() { return `<button id="vox" class="sndb ${voice === "on" ? "on" : voice === "off" ? "" : "warn"}" title="Voice control (V): say NEXT or NEXT SLIDE, GO BACK or PREVIOUS SLIDE">${V_LABEL[voice]}</button>`; }
function voiceUI() { vlog({ engine: dict ? "claude dictation" : SR ? "browser" : "none" }); const b = $("#vox"); if (b) { b.textContent = V_LABEL[voice]; b.className = "sndb " + (voice === "on" ? "on" : voice === "off" ? "" : "warn"); } }
function voiceHeard(t) {
  const h = $(".hint"); if (!h) return;
  if (h.dataset.o == null) h.dataset.o = h.innerHTML;
  h.textContent = "HEARD: "; h.appendChild(Object.assign(document.createElement("b"), { textContent: t })); h.classList.add("heard");
  clearTimeout(vHint); vHint = setTimeout(() => { if (h.isConnected && h.dataset.o != null) { h.innerHTML = h.dataset.o; delete h.dataset.o; h.classList.remove("heard"); } }, 1600);
}
function voiceFeed(text, final) {          // every piece of recognised speech passes through here
  const now = Date.now(); let t = vNorm(text || "");
  if (VDBG && (text || "").trim()) vlog({ heard: JSON.stringify(text), kind: final ? "settled" : "live", events: VD.events + 1 });
  if (vDone && now - vFiredAt > 30000) vDone = "";
  if (final && t && !vDone && now - vFiredAt < 2000 && (voiceMatch(t) || (t === "next" ? "next" : null)) === vCmd) return;   // repeat of the phrase just acted on
  if (!final && !t && !vPart) return;       // an empty live guess after a settled phrase changes nothing
  if (final) {                              // a settled piece of text
    vPart = "";
    if (vDone) {                            // it is (part of) a phrase we already acted on while it was still being spoken: never act on it twice
      if (vDone.startsWith(t)) { vDone = vDone.slice(t.length).trim(); t = ""; }
      else if (t.startsWith(vDone)) { t = t.slice(vDone.length).trim(); vDone = ""; }
      else { if (voiceMatch(t) === vCmd) t = ""; vDone = ""; }                    // reworded copy of that phrase: drop it; anything else is new speech
    }
    if (t) vBuf = (vBuf + " " + t).trim().slice(-80);
  } else vPart = !vDone ? t : t.startsWith(vDone) ? t.slice(vDone.length).trim() : "";   // live guess: only words after the part already acted on count
  // "next" on its own counts only when it is the whole phrase, so "what comes next" does not move the slide
  const cand = (vBuf + " " + vPart).trim(), cmd = voiceMatch(cand) || ((final ? t : vPart) === "next" ? "next" : null);
  clearTimeout(vWait);
  if (cmd) vWait = setTimeout(() => voiceDo(cmd), Math.max(550, vMute - now));
}
function voiceDo(cmd) {
  vFiredAt = Date.now(); vMute = vFiredAt + 700; vCmd = cmd; vlog({ command: cmd + " at " + new Date().toTimeString().slice(0, 8) });
  vDone = (vDone + " " + vPart).trim(); vBuf = vPart = "";
  if (cmd === "next") { if (typing) stopTyping(true); next(); } else back();
  voiceHeard(cmd === "next" ? "NEXT SLIDE" : "GO BACK");
}
function dictEnd(reason) {
  vlog({ error: "dictation ended: " + reason });
  if (reason === "not_granted") voice = "blocked";
  else if (reason === "unavailable") { if (dictLang) { dictLang = false; voice = "paused"; } else voice = "none"; }
  else if (reason === "viewer_stopped" || reason === "stopped" || reason === "dismissed") voice = "off";
  else voice = ++vFails >= 3 ? "error" : "paused";            // hidden tab, time limit, service hiccup: the next key press or click starts it again
  voiceUI();
}
function dictState(e) {
  if (e.state === "listening") { voice = "on"; vFails = 0; voiceUI(); }
  else if (e.state === "idle") { vDone = vPart = ""; if (voice === "on" || voice === "wait") dictEnd(e.reason); }
}
try {
  if (window.claude && window.claude.use) window.claude.use("dictation").then(d => {
    if (!d) return; dict = d;
    d.onPartial(e => voiceFeed(e.text, false)); d.onFinal(e => voiceFeed(e.text, true)); d.onState(dictState);
  }, () => {});
} catch (_) {}
function nativeStart(auto) {                                     // auto = restarted by the page, not by a tap or key press
  const r = rec = new SR(); r.lang = "en-US"; r.continuous = !PHONE; r.interimResults = true; vlog({ starts: VD.starts + 1 });
  if (voice !== "on") voice = "wait";
  r.onstart = () => { if (rec === r && voice === "wait") { voice = "on"; voiceUI(); } };
  r.onresult = e => {
    vFails = 0; let part = "";
    for (let i = e.resultIndex; i < e.results.length; i++) { const x = e.results[i]; if (x.isFinal) voiceFeed(x[0].transcript, true); else part += " " + x[0].transcript; }
    voiceFeed(part, false);
  };
  r.onerror = e => {
    vlog({ error: e.error + (e.message ? " (" + e.message + ")" : "") + " at " + new Date().toTimeString().slice(0, 8) });
    if (rec !== r) return; const c = e.error;
    if (c === "not-allowed" || c === "service-not-allowed" || c === "audio-capture") voice = auto && c === "not-allowed" ? "paused" : "blocked";   // some phones only allow a start from a tap: the next tap starts it again
    else if (c === "network") { if (++vFails >= 3) voice = "net"; }
    else if (c !== "no-speech" && c !== "aborted") { if (++vFails >= 3) voice = "error"; }
    voiceUI();
  };
  r.onend = () => {                                             // the browser ends a session after a pause: start the next one
    if (rec !== r) return; rec = null; vDone = vPart = "";
    if (voice === "on" || voice === "wait") setTimeout(() => { if ((voice === "on" || voice === "wait") && !rec) { nativeStart(true); voiceUI(); } }, PHONE ? 120 : 300);
  };
  try { r.start(); } catch (x) { rec = null; voice = auto ? "paused" : "error"; vlog({ error: "start failed: " + (x && x.name) }); }
}
function voiceStart() {                                          // must run inside a click or key press
  vBuf = vPart = vDone = ""; clearTimeout(vWait);
  if (dict) {
    voice = "wait";
    vlog({ starts: VD.starts + 1 });
    dict.start(dictLang ? { language: "en" } : undefined).catch(err => { vlog({ error: "start rejected: " + (err && err.code) }); if (voice === "wait") dictEnd(err && err.code); });
  } else if (SR) nativeStart();
  else voice = "none";
  voiceUI();
}
function toggleVoice() {
  if (voice === "on" || voice === "wait" || voice === "paused") {
    voice = "off"; clearTimeout(vWait);
    if (dict) dict.stop().catch(() => {}); else if (rec) { const r = rec; rec = null; try { r.abort(); } catch (_) {} }
    voiceUI(); sfx("back");
  } else { vFails = 0; voiceStart(); sfx("tick"); }
}
if (VDBG) setTimeout(() => vlog({ engine: dict ? "claude dictation" : SR ? "browser" : "none" }), 1500);
addEventListener("click", () => { if (voice === "paused") voiceStart(); }, true);
addEventListener("touchend", () => { if (voice === "paused") voiceStart(); }, true);

function levelScene(lv) { return SCENES.findIndex(s => s.type === "level" && s.lv === lv); }
function go(i, atEnd) { si = Math.max(0, Math.min(SCENES.length - 1, i)); const s = SCENES[si]; st = atEnd && s.steps ? s.steps.length - 1 : 0; render(true); }
function stepSound(p) { sfx(p && p.sfx ? p.sfx : p && p.shake ? "hurt" : "step"); }
function next() {
  if (typing) { stopTyping(true); return; }
  const s = SCENES[si];
  if (s.type === "title") { sfx("start"); return go(1); }
  if (s.type === "map") { sfx("level"); return go(levelScene(mapSel)); }
  if (s.type === "end") { sfx("start"); return go(0); }
  if (s.steps && st < s.steps.length - 1) { st++; if (s.type === "refs") { sfx("step"); return render(false); } stepSound(s.steps[st]); return step(); }
  const n = SCENES[si + 1];
  if (n) { if (n.type === "level") sfx("level"); else if (n.type === "end") sfx("win"); else if (n.type === "lesson") stepSound(n.steps[0]); else sfx("scene"); }
  go(si + 1);
}
function back() {
  const s = SCENES[si]; sfx("back");
  if (s.steps && st > 0) { st--; return s.type === "refs" ? render(false) : step(); }
  if (si > 0) go(si - 1, true);
}
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, s = SCENES[si];
  if (s.type === "map" && (k === "ArrowDown" || k === "ArrowUp")) { mapSel = Math.max(0, Math.min(LEVELS.length - 1, mapSel + (k === "ArrowDown" ? 1 : -1))); sfx("move"); render(false); e.preventDefault(); return; }
  if (k >= "1" && k <= "6") { mapSel = +k - 1; sfx("level"); go(levelScene(mapSel)); return; }
  if (k === "s" || k === "S") { setMute(!muted); return; }
  if (k === "v" || k === "V") { toggleVoice(); return; }
  if (voice === "paused") voiceStart();
  if (k === "Enter" || k === " " || k === "ArrowRight" || k === "PageDown") { e.preventDefault(); next(); }
  else if (k === "Backspace" || k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); back(); }
  else if (k === "m" || k === "M") { sfx("scene"); go(1); }
  else if (k === "Home") go(0);
  else if (k === "f" || k === "F") { try { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); } catch (_) {} }
});
render(false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
